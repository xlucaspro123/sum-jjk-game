<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THIN ICE BREAKER // JJK Pro Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="hud">
        <div class="player-bar">
            <div class="hp-container"><div id="p1-hp" class="hp-fill"></div></div>
            <div class="ce-container"><div id="p1-ce" class="ce-fill"></div></div>
            <div class="info"><span style="color:#4facfe;">P1: AZUL (CE/Combos)</span><span id="p1-cd">TIB/FR/DE</span></div>
        </div>
        <div class="player-bar" style="text-align: right;">
            <div class="hp-container"><div id="p2-hp" class="hp-fill"></div></div>
            <div class="ce-container"><div id="p2-ce" class="ce-fill"></div></div>
            <div class="info"><span id="p2-cd">TIB/FR/DE</span><span style="color:#ffb199;">P2: ROJO (BOT/FLECHAS)</span></div>
        </div>
    </div>
    <div id="bot-indicator">BOT super pro xdd| [B=Bot, N=Dummy, D-Up=OK]</div>

    <canvas id="gameCanvas" width="1000" height="560"></canvas>
    <div id="controls-hint">P1: WASD+1(Jab), Hold1(Heavy), 2=TIB, 3=Frame, 4=Domain, E=Parry, Shift=Dash, F=Grab | Xbox: Stick+A(Tap/Hold), X/Y/B, LB/RB, LT=Grab</div>

    <div id="win-modal">
        <div class="win-box">
            <h2 id="win-text">¡Gana Jugador P1!</h2>
            <button class="win-btn" onclick="resetGame()">OK (D-Pad Up)</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
