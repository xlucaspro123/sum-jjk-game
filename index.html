<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJK 1v1 Simulator (can be played on 2 players)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>DOMAIN EXPANSION... (Haz click o toca para desbloquear audio)</h1>
        <div id="hud">
            <button onclick="testAction('hit')">Jab (hit)</button>
            <button onclick="testAction('block')">Block</button>
            <button onclick="testAction('dash')">Dash</button>
            <button onclick="testAction('blackFlash')">Black Flash</button>
            <button onclick="testAction('heavyBlackFlash')">Heavy BF</button>
            <button onclick="testAction('domain')">DOMAIN</button>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
